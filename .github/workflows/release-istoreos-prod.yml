- name: 🛠 提取并修改 EMB-3531 设备树
        run: |
          # 1. 安装设备树编译器 (DTC)
          sudo apt-get update && sudo apt-get install -y device-tree-compiler

          # 2. 定位并处理内核包 (基于日志 6.1.163)
          KERNEL_VER="6.1.163"
          echo "📥 正在下载内核包..."
          wget -q https://github.com/ophub/kernel/releases/download/kernel_stable/${KERNEL_VER}.tar.gz
          tar -zxf ${KERNEL_VER}.tar.gz

          # 3. 动态寻找并反编译 DTB
          TARGET_DTB=$(find . -name "*emb3531*.dtb" | head -n1)
          
          if [ -n "$TARGET_DTB" ]; then
            echo "✅ 找到目标设备树: $TARGET_DTB"
            dtc -I dtb -O dts "$TARGET_DTB" -o temp.dts
            
            # 4. 【关键修改】在此处添加您的修改逻辑
            # 示例：修复 I2C 节点状态
            sed -i '/i2c@ff3d0000 {/,/status/s/disabled/okay/' temp.dts
            
            # 5. 回编译为二进制并覆盖原文件
            dtc -I dts -O dtb temp.dts -o "$TARGET_DTB"
            echo "🚀 DTB 修改并回编完成"
          else
            echo "❌ 错误：未在内核包中找到 emb3531 相关的 DTB 文件"
            exit 1
          fi
